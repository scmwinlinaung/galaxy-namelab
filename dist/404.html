<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galaxy NameLab</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // See: https://github.com/rafgraph/spa-github-pages
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // See: https://github.com/rafgraph/spa-github-pages
    (function(l) {
      var path = l.pathname;
      var search = l.search;
      var hash = l.hash;

      // Redirect to index.html with the path encoded in the query string
      var redirectUrl = '/' + (path === '/' ? '' : '?path=' + encodeURIComponent(path + search + hash));

      // Add hash if present
      if (hash) {
        redirectUrl += hash;
      }

      window.location.replace(redirectUrl);
    }(window.location))
  </script>
</body>
</html>
